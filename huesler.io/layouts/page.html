{{ define "main" }}
{{ if eq .Section "posts" }}
<div class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <span class="post-date">{{ .Date.Format "02 Jan 2006" }}</span>
  {{ .Content }}
</div>
{{ else }}
<div class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ .Content }}
</div>
{{ end }}
{{ end }}
